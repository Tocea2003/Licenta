# Broker MQTT pentru dezvoltare locală (docker-compose). Dispozitivele din autobuze (aici: BusSimulator)
# publică pe tursib/vehicles/{id}/position; serviciul de ingestie se abonează la tursib/vehicles/+/position.

listener 1883 0.0.0.0
persistence false

# DOAR PENTRU DEZVOLTARE: conexiuni anonime.
allow_anonymous true

# În producție: autentificare + ACL, ca un dispozitiv să poată publica doar pentru el însuși
# (serviciul de ingestie refuză oricum un payload al cărui id nu coincide cu cel din topic).
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
#   acl_file /mosquitto/config/acl
# și în fișierul acl:
#   pattern write tursib/vehicles/%c/position     # %c = client id = id-ul vehiculului
#   user ingestion
#   topic read tursib/vehicles/+/position
