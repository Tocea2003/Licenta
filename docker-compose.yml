version: "3.8"

services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_DB=tursib
      - POSTGRES_USER=tursib
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tursib}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tursib -d tursib"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: TursibBackend/Dockerfile
    ports:
      - "5022:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JWT_KEY=${JWT_KEY}
      - GTFS_PATH=/app/gtfs
      - ConnectionStrings__DefaultConnection=Host=db;Database=tursib;Username=tursib;Password=${POSTGRES_PASSWORD:-tursib}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      # Set to redpanda:9092 to consume live positions (profile "events")
      - Kafka__BootstrapServers=${KAFKA_BOOTSTRAP_SERVERS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./TursibFrontend/Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  bus-simulator:
    build:
      context: .
      dockerfile: BusSimulator/Dockerfile
    environment:
      - TURSIB_API_URL=http://backend:8080/api
      - FIREBASE_URL=${FIREBASE_URL}
      # firebase, mqtt or mqtt,firebase
      - PUBLISH_TARGETS=${PUBLISH_TARGETS:-firebase}
      - MQTT_HOST=mosquitto
    depends_on:
      - backend
    restart: unless-stopped

  # ---------- Event pipeline (docker compose --profile events up) ----------

  # MQTT broker: the simulated on-board devices publish here
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    profiles: [events]
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  # Kafka-compatible event log (single node, dev mode)
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    profiles: [events]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20
    volumes:
      - redpanda:/var/lib/redpanda/data
    restart: unless-stopped

  # Creates the topics once; vehicle-positions is keyed by vehicle id
  redpanda-init:
    image: redpandadata/redpanda:v24.2.18
    profiles: [events]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk topic create vehicle-positions -p 6 -X brokers=redpanda:9092 || true;
        rpk topic create vehicle-positions-dlq -p 1 -X brokers=redpanda:9092 || true
    restart: "no"

  # Web UI for topics and messages: http://localhost:8081
  redpanda-console:
    image: redpandadata/console:v2.8.2
    profiles: [events]
    environment:
      - KAFKA_BROKERS=redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # MQTT -> validation -> Kafka
  ingestion:
    build:
      context: .
      dockerfile: TursibIngestion/Dockerfile
    profiles: [events]
    environment:
      - MQTT_HOST=mosquitto
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
    depends_on:
      mosquitto:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  redpanda:
