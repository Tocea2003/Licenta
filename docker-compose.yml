services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_DB=tursib
      - POSTGRES_USER=tursib
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tursib}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tursib -d tursib"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # --- Platforma pe evenimente: simulator --MQTT--> ingestie --Kafka--> backend ---
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    restart: unless-stopped

  # Redpanda: compatibil Kafka, un singur proces (fără ZooKeeper/KRaft de configurat). Din afara rețelei compose: localhost:19092.
  redpanda:
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # --- Observabilitate: OpenTelemetry Collector → Jaeger (urme, http://localhost:16686) și Prometheus (metrici, :9090) ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./infra/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: TursibIngestion/Dockerfile
    environment:
      - Mqtt__Host=mosquitto
      # abonament partajat: mai multe instanțe (docker compose up --scale ingestion=2) își împart mesajele
      - Mqtt__SharedGroup=ingestion
      - Kafka__BootstrapServers=redpanda:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_TRACES_SAMPLER_ARG=0.2
    depends_on:
      mosquitto:
        condition: service_started
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: TursibBackend/Dockerfile
    ports:
      - "5022:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JWT_KEY=${JWT_KEY}
      - GTFS_PATH=/app/gtfs
      - ConnectionStrings__DefaultConnection=Host=db;Database=tursib;Username=tursib;Password=${POSTGRES_PASSWORD:-tursib}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - INGEST_API_KEY=${INGEST_API_KEY:-dev-ingest-key}
      # pozițiile vin din Kafka; istoricul pentru replay se salvează în PostgreSQL
      - Kafka__BootstrapServers=redpanda:9092
      - History__Enabled=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_TRACES_SAMPLER_ARG=0.2
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./TursibFrontend/Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  bus-simulator:
    build:
      context: ./BusSimulator
      dockerfile: Dockerfile
    environment:
      - TURSIB_API_URL=http://backend:8080/api
      # pozițiile se publică pe MQTT (ca dispozitive din autobuze); Firebase rămâne doar rezervă pentru frontend
      - MQTT_HOST=mosquitto
      - FIREBASE_ENABLED=${FIREBASE_ENABLED:-false}
      - FIREBASE_URL=${FIREBASE_URL}
      - APPLY_HOLDS=${APPLY_HOLDS:-false}
    depends_on:
      - backend
      - mosquitto
    restart: unless-stopped

volumes:
  pgdata:
