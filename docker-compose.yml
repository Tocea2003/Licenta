version: "3.8"

services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_DB=tursib
      - POSTGRES_USER=tursib
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tursib}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tursib -d tursib"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./TursibBackend
      dockerfile: Dockerfile
    ports:
      - "5022:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JWT_KEY=${JWT_KEY}
      - GTFS_PATH=/app/gtfs
      - ConnectionStrings__DefaultConnection=Host=db;Database=tursib;Username=tursib;Password=${POSTGRES_PASSWORD:-tursib}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./TursibFrontend/Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  bus-simulator:
    build:
      context: ./BusSimulator
      dockerfile: Dockerfile
    environment:
      - TURSIB_API_URL=http://backend:8080/api
      - FIREBASE_URL=${FIREBASE_URL}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
