<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="15%" fill="#3b82f6"/>
  <g fill="#ffffff">
    <!-- Bus body -->
    <rect x="156" y="180" width="200" height="160" rx="20" ry="20"/>
    <rect x="140" y="200" width="232" height="120" rx="15" ry="15" fill="#3b82f6"/>
    <rect x="150" y="210" width="212" height="100" rx="10" ry="10" fill="#ffffff"/>
    
    <!-- Windows -->
    <rect x="170" y="225" width="70" height="50" rx="5" ry="5" fill="#3b82f6"/>
    <rect x="272" y="225" width="70" height="50" rx="5" ry="5" fill="#3b82f6"/>
    
    <!-- Wheels -->
    <circle cx="200" cy="340" r="25" fill="#1e293b"/>
    <circle cx="312" cy="340" r="25" fill="#1e293b"/>
    <circle cx="200" cy="340" r="12" fill="#64748b"/>
    <circle cx="312" cy="340" r="12" fill="#64748b"/>
    
    <!-- Route number -->
    <text x="256" y="380" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffffff">11</text>
  </g>
